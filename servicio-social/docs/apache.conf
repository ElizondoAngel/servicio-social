# VirtualHost de ejemplo para Apache 2.4. Ajustar dominio, rutas y certificados.
<VirtualHost *:80>
    ServerName serviciosocial.ejemplo.edu.mx
    Redirect permanent / https://serviciosocial.ejemplo.edu.mx/
</VirtualHost>

<VirtualHost *:443>
    ServerName serviciosocial.ejemplo.edu.mx
    DocumentRoot /var/www/servicio-social/public

    SSLEngine on
    SSLCertificateFile    /ruta/al/certificado.crt
    SSLCertificateKeyFile /ruta/a/la/llave.key

    <Directory /var/www/servicio-social/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Nada fuera de public/ es accesible
    <DirectoryMatch "^/var/www/servicio-social/(src|config|storage|database|vendor|bin|tests|tools)">
        Require all denied
    </DirectoryMatch>

    # HSTS también lo pone la aplicación; aquí cubre los archivos estáticos (requiere mod_headers).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # PHP (si se usa mod_php; con PHP-FPM van en el pool o en php.ini)
    php_admin_flag display_errors off
    php_admin_flag log_errors on
    php_admin_value upload_max_filesize 50M
    php_admin_value post_max_size 55M
    # expose_php solo se puede apagar en php.ini: expose_php = Off
</VirtualHost>
